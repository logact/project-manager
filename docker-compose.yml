services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-manager:latest
    container_name: project-manager
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - project-manager-data:/var/lib/project-manager/data
    environment:
      - NODE_ENV=production
      - PORT=8002
      - DATA_DIR=/var/lib/project-manager/data
      - DATABASE_URL=${DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  project-manager-data:
