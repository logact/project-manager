services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pm-backend
    restart: unless-stopped
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8082
      - CORS_ORIGIN=http://localhost:8081
    networks:
      - pm-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pm-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - pm-network

networks:
  pm-network:
    driver: bridge
